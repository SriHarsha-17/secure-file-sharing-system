<!doctype html>
<html>
<head><meta charset="utf-8"><title>Secure Share</title>
<link rel="stylesheet" href="/static/app.css"></head>
<body>
<main>
<section class="card">
<h2>Secure File Share</h2>
<p id="status">Checking share...</p>
<button onclick="download()">Download encrypted file</button>
</section>
</main>
<script>
async function download(){
 const token=new URLSearchParams(location.search).get("token");
 if(!token)return alert("Missing token");
 const r=await fetch("/api/files/share/"+encodeURIComponent(token)+"/download/");
 if(!r.ok){document.getElementById("status").textContent=await r.text();return;}
 const blob=await r.blob();
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="shared-file.enc";
 a.click();
}
</script>
</body>
</html>
