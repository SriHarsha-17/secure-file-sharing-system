<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Secure File Sharing</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <h1>Secure File Sharing</h1>
  <nav>
    <button onclick="show('login')">Login</button>
    <button onclick="show('register')">Register</button>
    <button onclick="show('files')">Files</button>
    <button onclick="show('spaces')">Secure Spaces</button>
    <button onclick="logout()">Logout</button>
  </nav>
</header>

<main>
<section id="login" class="card">
<h2>Login</h2>
<input id="login-user" placeholder="Username">
<input id="login-pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<div id="mfa-box" hidden>
  <input id="otp" placeholder="6-digit OTP">
  <button onclick="verifyMfa()">Verify OTP</button>
</div>
<pre id="login-out"></pre>
</section>

<section id="register" class="card" hidden>
<h2>Register</h2>
<input id="reg-user" placeholder="Username">
<input id="reg-email" placeholder="Email">
<input id="reg-pass" type="password" placeholder="Password (8+ chars)">
<button onclick="register()">Create account</button>
<pre id="reg-out"></pre>
</section>

<section id="files" class="card" hidden>
<h2>Encrypted Files</h2>
<input id="file-input" type="file">
<input id="recipient" placeholder="Optional recipient username">
<button onclick="encryptAndUpload()">Encrypt & Upload</button>
<div id="file-list"></div>
</section>

<section id="spaces" class="card" hidden>
<h2>Secure Spaces</h2>
<input id="space-name" placeholder="Space name">
<button onclick="createSpace()">Create Space</button>
<div id="space-list"></div>
</section>

<section id="audit" class="card">
<h2>Audit Log</h2>
<button onclick="loadAudit()">Refresh</button>
<pre id="audit-out"></pre>
</section>
</main>

<script src="/static/crypto.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
